name: Build A.L.E.X. 3D asset
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_exosuit.py'
      - '.github/workflows/build-exosuit.yml'
permissions:
  contents: write
jobs:
  build-glb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mesh builder
        run: python -m pip install --upgrade pip numpy trimesh
      - name: Generate named GLB model
        run: python tools/build_exosuit.py
      - name: Commit generated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/alex-exosuit.glb
          if git diff --cached --quiet; then
            echo "GLB is already current"
            exit 0
          fi
          git commit -m "Generate modular A.L.E.X. exosuit GLB"
          git push
